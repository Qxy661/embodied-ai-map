[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-ai-map"
version = "0.1.0"
description = "An executable survey: autonomous driving x embodied intelligence, one running block per claim"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]

[tool.setuptools]
packages = ["lib"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
# The block READMEs carry column-aligned tables; never reflow them.
exclude = ["**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
